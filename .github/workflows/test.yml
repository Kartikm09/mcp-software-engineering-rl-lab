name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - name: Record the concrete Rust compiler path
        run: echo "MCP_RL_RUSTC=$(rustup which rustc)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/validate_task_packages.py
      - run: python scripts/validate_structured_files.py
      - run: python scripts/check_markdown_links.py
      - run: python -m pytest
      - run: python scripts/secret_scan.py
