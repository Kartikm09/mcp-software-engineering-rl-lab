name: safety scan

on:
  push:
  pull_request:
  schedule:
    - cron: "31 6 * * 1"

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -e '.[dev]' pip-audit
      - run: python scripts/secret_scan.py
      - run: python -m pip_audit --local --skip-editable
