name: build environments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "environments/**"
      - "tasks/**"
      - "scripts/build_environments.py"

permissions:
  contents: read

jobs:
  resolve-toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -e .
      - run: python scripts/build_environments.py
