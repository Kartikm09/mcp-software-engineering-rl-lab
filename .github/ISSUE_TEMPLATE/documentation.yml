name: Documentation improvement
description: Clarify a command, contract, diagram, or limitation.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Document and section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or inaccurate?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
    validations:
      required: true
