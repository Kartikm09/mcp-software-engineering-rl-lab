name: Task proposal
description: Propose one scoped synthetic engineering task.
title: "task: "
labels: [task]
body:
  - type: input
    id: language
    attributes:
      label: Language and toolchain
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Observable baseline failure
    validations:
      required: true
  - type: textarea
    id: hidden
    attributes:
      label: MCP-discoverable contract
      description: Explain what is hidden from the initial prompt and why discovery is useful.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Golden and negative controls
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: The proposed code and fixtures are synthetic and public-safe.
          required: true
