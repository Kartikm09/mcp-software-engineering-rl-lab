[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-software-engineering-rl-lab"
version = "0.1.0"
description = "Reproducible MCP tool-discovery environments for evaluating coding-agent engineering work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kartik BK Mishra" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "mcp==2.0.0",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
mcp-rl-lab = "mcp_rl_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_rl_lab", "mcp_servers"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["toolchains: exercises installed Java, Rust, Go, Node, and C++ toolchains"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
